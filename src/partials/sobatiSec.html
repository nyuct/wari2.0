<style>
    .sobatiSec {
        width: 100%;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        position: relative;
        overflow: hidden;
        background: rgba(0, 0, 0, 0.5);

        .sobati-canvas {
            position: absolute;
            inset: 0;
            z-index: 0;
        }

        .sobati-canvas canvas {
            display: block;
        }

        .sobatiContent {
            position: relative;
            z-index: 1;

            h2 {
                font-size: 300px;
                color: #fdbd18;
                line-height: 1;
                margin: 0px;
            }

            p {
                font-size: 32px;
                color: #fff;
                line-height: 1;
                margin-top: 30px;
            }
        }
    }
</style>
<section class="sobatiSec">
    <div class="sobati-canvas" id="sobatiCanvas"></div>
    <div class="wrapper">
        <div class="sobatiContent fadeUp">
            <h2 class="jaini-regular">सोबत या</h2>
            <p class="mukta-light text-animation">(to be verified for come along)</p>
        </div>
    </div>
</section>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.min.js"></script>
<script>
    // sobatiSec animated background ("Breathing Patterns" generative art)
    // effect adapted from https://codepen.io/VoXelo/full/myVpoLm
    new p5((p) => {
        let holder;

        p.setup = () => {
            holder = document.getElementById("sobatiCanvas");
            const c = p.createCanvas(holder.offsetWidth, holder.offsetHeight);
            c.parent("sobatiCanvas");
            p.pixelDensity(1);
        };

        p.draw = () => {
            // Transparent background: clear every frame so the section's texture
            // shows through (no smoky trail buildup).
            p.clear();

            p.translate(p.width / 2, p.height / 2);

            p.noFill();
            p.stroke(255, 30);
            p.strokeWeight(1);

            const time = p.frameCount * 0.008;
            const numLines = 80;
            const numPoints = 200;

            for (let i = 0; i < numLines; i++) {
                const linePhase = (i / numLines) * p.TWO_PI;

                for (const dir of [-1, 1]) {
                    p.beginShape();
                    for (let j = 0; j <= numPoints; j++) {
                        const pointPhase = j / numPoints;
                        const y = p.map(pointPhase, 0, 1, -p.height / 2.5, p.height / 2.5);

                        const envelope = p.sin(pointPhase * p.PI);
                        const wave1 = p.sin(time + linePhase) * 60;
                        const wave2 = p.sin(pointPhase * 8 + time * 2) * 40;
                        const centerComplexity = p.pow(p.cos(pointPhase * p.PI - p.HALF_PI), 2) * 100;
                        const wave3 = p.cos(linePhase * 4 - time) * centerComplexity;
                        const x = envelope * (wave1 + wave2 + wave3 + 60);

                        p.vertex(dir * x, y);
                    }
                    p.endShape();
                }
            }
        };

        p.windowResized = () => {
            if (holder) p.resizeCanvas(holder.offsetWidth, holder.offsetHeight);
        };
    });

</script>
