<style>
    .text-center {
        text-align: center;
    }

    .tube {
        position: relative;
        width: 100%;
        height: 60vh;
        padding: 100px 20px;
    }

    .linetxt {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        line-height: 1;
        margin: 0;
        letter-spacing: -0.6vw;
        font-size: 12vw;
        white-space: nowrap;
        text-align: center;
        color: #fdbd18;
    }

    .linetxt div {
        backface-visibility: hidden;
    }

    .pundalikTxt p {
        font-size: 32px;
        color: #fff;
        line-height: 1;
        margin: 60px 0px 0px 0px;
    }
</style>
<div class="pundalikIntro">
    <audio id="bgAudio" src="audio/pundalik-audio.mp3" preload="auto"></audio>
    <!-- <div class="warkariImg">
                <img src="assets/images/warkari-1.png" alt="warkari">
            </div> -->
    <div class="pundalikTxt fadeUp">
        <div class="tube">
            <h1 class="jaini-regular linetxt line1">पुंडलिक वरदे हरी विठ्ठल</h1>
            <h1 class="jaini-regular linetxt line2">पुंडलिक वरदे हरी विठ्ठल</h1>
            <h1 class="jaini-regular linetxt line3">पुंडलिक वरदे हरी विठ्ठल</h1>
            <h1 class="jaini-regular linetxt line3">पुंडलिक वरदे हरी विठ्ठल</h1>
        </div>
        <p class="mukta-regular text-center">Simplicity, discipline, and surrender to devotion.</p>
    </div>
</div>
<script>
    // Audio autoplay on scroll reach .pundalikIntro / .pundalikTxt
    (function () {
        const audio = document.getElementById("bgAudio");
        const triggerEl = document.querySelector(".pundalikIntro") || document.querySelector(".pundalikTxt");
        if (!audio || !triggerEl) return;

        let userUnlocked = false;
        const unlock = () => {
            userUnlocked = true;
            window.removeEventListener("pointerdown", unlock);
            window.removeEventListener("keydown", unlock);
            window.removeEventListener("touchstart", unlock);
        };
        window.addEventListener("pointerdown", unlock, { passive: true });
        window.addEventListener("keydown", unlock, { passive: true });
        window.addEventListener("touchstart", unlock, { passive: true });

        function playAudio() {
            audio.muted = false;
            const playPromise = audio.play();
            if (playPromise !== undefined) {
                playPromise.catch((err) => {
                    // If browser blocked unmuted sound due to interaction policy, play muted first then unmute on interaction
                    audio.muted = true;
                    audio.play().then(() => {
                        const unmuteOnce = () => {
                            audio.muted = false;
                            window.removeEventListener("scroll", unmuteOnce);
                            window.removeEventListener("click", unmuteOnce);
                            window.removeEventListener("touchstart", unmuteOnce);
                        };
                        window.addEventListener("scroll", unmuteOnce, { passive: true });
                        window.addEventListener("click", unmuteOnce, { passive: true });
                        window.addEventListener("touchstart", unmuteOnce, { passive: true });
                    }).catch(() => {});
                });
            }
        }

        function pauseAudio() {
            audio.pause();
        }

        if (typeof ScrollTrigger !== "undefined") {
            ScrollTrigger.create({
                trigger: triggerEl,
                start: "top 75%",
                end: "bottom 15%",
                onEnter: playAudio,
                onEnterBack: playAudio,
                onLeave: pauseAudio,
                onLeaveBack: pauseAudio
            });
        } else {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach((entry) => {
                    if (entry.isIntersecting) {
                        playAudio();
                    } else {
                        pauseAudio();
                    }
                });
            }, { threshold: 0.2 });
            observer.observe(triggerEl);
        }
    })();

    // Make container visible
    const container = document.querySelector(".pundalikTxt");
    gsap.set(container, { visibility: "visible" });

    // Grab all lines
    const lines = document.querySelectorAll(".linetxt");

    // Split characters for all lines
    const splitLines = Array.from(lines).map(line =>
        SplitText.create(line, { type: "chars", charsClass: "char" })
    );

    // 3D setup
    const width = window.innerWidth;
    const height = window.innerHeight;
    const depth = -width / 6;
    const transformOrigin = `50% 50% ${depth}`;

    gsap.set(lines, { perspective: 700, transformStyle: "preserve-3d" });

    // Timeline animation
    const animTime = 2.0;
    const tl = gsap.timeline({ repeat: -1 });

    // Animate each line in a loop
    splitLines.forEach((split, index) => {
        tl.fromTo(
            split.chars,
            { rotationX: -90 },
            { rotationX: 90, stagger: 0.08, duration: animTime, ease: "none", transformOrigin },
            index * 0.45 // stagger between lines
        );
    });
</script>
