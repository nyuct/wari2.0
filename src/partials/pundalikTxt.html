<style>
    .text-center {
        text-align: center;
    }

    .tube {
        position: relative;
        width: 100%;
        height: 60vh;
        padding: 100px 20px;
    }

    .linetxt {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        line-height: 1;
        margin: 0;
        letter-spacing: -0.6vw;
        font-size: 12vw;
        white-space: nowrap;
        text-align: center;
        color: #fdbd18;
    }

    .linetxt div {
        backface-visibility: hidden;
    }

    .pundalikTxt p {
        font-size: 32px;
        color: #fff;
        line-height: 1;
        margin: 60px 0px 0px 0px;
    }
</style>
<div class="pundalikIntro">
    <audio id="bgAudio" src="assets/audio/pundalik-audio.mp3" autoplay muted></audio>
    <!-- <div class="warkariImg">
                <img src="assets/images/warkari-1.png" alt="warkari">
            </div> -->
    <div class="pundalikTxt fadeUp">
        <div class="tube">
            <h1 class="jaini-regular linetxt line1">पुंडलिक वरदे हरी विठ्ठल</h1>
            <h1 class="jaini-regular linetxt line2">पुंडलिक वरदे हरी विठ्ठल</h1>
            <h1 class="jaini-regular linetxt line3">पुंडलिक वरदे हरी विठ्ठल</h1>
            <h1 class="jaini-regular linetxt line3">पुंडलिक वरदे हरी विठ्ठल</h1>
        </div>
        <p class="mukta-regular text-center">Simplicity, discipline, and surrender to devotion.</p>
    </div>
</div>
<script>
    // Make container visible
    const container = document.querySelector(".pundalikTxt");
    gsap.set(container, { visibility: "visible" });

    // Grab all lines
    const lines = document.querySelectorAll(".linetxt");

    // Split characters for all lines
    const splitLines = Array.from(lines).map(line =>
        SplitText.create(line, { type: "chars", charsClass: "char" })
    );

    // 3D setup
    const width = window.innerWidth;
    const height = window.innerHeight;
    const depth = -width / 6;
    const transformOrigin = `50% 50% ${depth}`;

    gsap.set(lines, { perspective: 700, transformStyle: "preserve-3d" });

    // Timeline animation
    const animTime = 2.0;
    const tl = gsap.timeline({ repeat: -1 });

    // Animate each line in a loop
    splitLines.forEach((split, index) => {
        tl.fromTo(
            split.chars,
            { rotationX: -90 },
            { rotationX: 90, stagger: 0.08, duration: animTime, ease: "none", transformOrigin },
            index * 0.45 // stagger between lines
        );
    });
</script>
